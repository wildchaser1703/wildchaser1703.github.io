services:
  gate:
    build: .
    ports:
      - "127.0.0.1:${GATE_PORT:-8010}:8000"
    environment:
      BACKEND: synthetic
      TOKEN_BUDGET: "512"
      MAX_CONCURRENCY: "4"
      QUEUE_LIMIT: "8"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
