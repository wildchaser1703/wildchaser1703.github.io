[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-gate"
version = "0.1.0"
description = "Token-budget admission control and reproducible overload experiments for local LLM serving"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "transformers>=4.48,<5"]

[project.optional-dependencies]
local = ["torch>=2.5,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["gate*"]

[tool.setuptools.package-data]
gate = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
